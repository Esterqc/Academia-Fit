<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escolha seu Plano - Academia Fit</title>
  <link rel="stylesheet" href="../Css/planos.css">
</head>
<body>

  <div class="planos-container">
    <h1>Escolha seu Plano</h1>

    <div class="planos">
      <div class="plano" onclick="escolherPlano('Básico')">
        <h2>Plano Básico</h2>
        <p>R$ 59,90/mês</p>
        <p>Aulas em grupo + Equipamentos</p>
      </div>

      <div class="plano" onclick="escolherPlano('Premium')">
        <h2>Plano Premium</h2>
        <p>R$ 89,90/mês</p>
        <p>Aulas + Equipamentos + Personal Trainer</p>
      </div>

      <div class="plano" onclick="escolherPlano('VIP')">
        <h2>Plano VIP</h2>
        <p>R$ 190,90/mês</p>
        <p>Tudo incluso + Eventos Exclusivos</p>
      </div>
    </div>
  </div>

  <!-- JS deve vir após o HTML -->
  <script src="../Js/planos.js"></script>

</body>
</html>
