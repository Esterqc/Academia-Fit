<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Assinar Plano - Academia Fit</title>
  <link rel="stylesheet" href="../Css/assinar.css" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="container">
    <h1>Assinar Plano</h1>
    <form class="signup-form">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" required>

      <label for="cpf">CPF</label>
      <input type="text" id="cpf" name="cpf" maxlength="14" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="plano">Escolha o plano</label>
      <select id="plano" name="plano" required>
        <option value="">Selecione...</option>
        <option value="basico">Plano Básico</option>
        <option value="premium">Plano Premium</option>
        <option value="vip">Plano VIP</option>
      </select>

      <label for="pagamento">Forma de Pagamento</label>
      <select id="pagamento" name="pagamento" required>
        <option value="">Selecione...</option>
        <option value="cartao">Cartão de Crédito</option>
        <option value="boleto">Boleto Bancário</option>
        <option value="pix">PIX</option>
      </select>

      <!-- Cartão -->
      <div id="cartao-info" class="pagamento-info" style="display: none;">
        <label for="numero">Número do Cartão</label>
        <input type="text" id="numero" name="numero" maxlength="19" placeholder="0000 0000 0000 0000">

        <label for="validade">Validade (MM/AA)</label>
        <input type="text" id="validade" name="validade" maxlength="5" placeholder="MM/AA">

        <label for="cvv">CVV</label>
        <input type="text" id="cvv" name="cvv" maxlength="4" placeholder="123">
      </div>

      <!-- Boleto -->
      <div id="boleto-info" class="pagamento-info" style="display: none;">
        <p>Um boleto será gerado após a confirmação da assinatura e enviado para o seu e-mail.</p>
      </div>

      <!-- PIX -->
      <div id="pix-info" class="pagamento-info" style="display: none;">
        <p>Use a chave PIX: <strong>academiafit@pagamentos.com</strong> para realizar o pagamento.</p>
      </div>

      <div id="preco-plano">Preço: R$ 0,00/mês</div>

      <button type="submit">Finalizar Assinatura</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Academia Fit. Todos os direitos reservados.</p>
  </footer>

  <script src="../Js/assinar.js"></script>
</body>
</html>
